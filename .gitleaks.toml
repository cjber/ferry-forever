[extend]
useDefault = true

# The walking maps are base64 generated by tools/baker/gen_nav.py ("do not edit"); their long runs of
# [A-Za-z0-9+/] match the generic key patterns hundreds of times and can hold no secret.
[[allowlists]]
description = "generated walking-map data"
paths = ['''^ShortestPathForever_Nav\d+/Nav\d+\.lua$''']
