<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Shortest Path Forever</title>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbe7a1"/><stop offset="0.45" stop-color="#d9a441"/><stop offset="1" stop-color="#7a4f14"/>
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#3a2a1c"/><stop offset="1" stop-color="#120c08"/>
    </radialGradient>
    <radialGradient id="pin" cx="40%" cy="30%" r="75%">
      <stop offset="0" stop-color="#fff6cf"/><stop offset="0.5" stop-color="#f2c14e"/><stop offset="1" stop-color="#9a5e12"/>
    </radialGradient>
  </defs>

  <rect x="6" y="6" width="244" height="244" rx="28" fill="url(#gold)"/>
  <rect x="16" y="16" width="224" height="224" rx="20" fill="url(#bg)"/>

  <!-- walking leg: gold, dotted, as the addon draws it -->
  <path d="M48 208 C74 210 70 178 90 168 C102 162 110 164 118 158" fill="none" stroke="#000" stroke-opacity="0.55"
    stroke-width="21" stroke-linecap="round" stroke-dasharray="0 26" transform="translate(3 4)"/>
  <path d="M48 208 C74 210 70 178 90 168 C102 162 110 164 118 158" fill="none" stroke="#ffd100"
    stroke-width="18" stroke-linecap="round" stroke-dasharray="0 26"/>
  <circle cx="48" cy="208" r="15" fill="url(#gold)" stroke="#4a2c08" stroke-width="4"/>

  <!-- boat leg: cyan with a dark border, dock to the pin -->
  <path d="M122 154 C132 130 150 142 164 136" fill="none" stroke="#02161e" stroke-width="20" stroke-linecap="round"/>
  <path d="M122 154 C132 130 150 142 164 136" fill="none" stroke="#00bfff" stroke-width="12" stroke-linecap="round"/>
  <circle cx="122" cy="155" r="11" fill="#00bfff" stroke="#02161e" stroke-width="4"/>

  <!-- destination: the waypoint pin at the journey's end -->
  <g transform="translate(172 44) scale(1.15)">
    <path d="M0 92 C-10 70 -38 50 -38 22 A38 38 0 0 1 38 22 C38 50 10 70 0 92 Z" fill="#000" opacity="0.45" transform="translate(4 5)"/>
    <path d="M0 92 C-10 70 -38 50 -38 22 A38 38 0 0 1 38 22 C38 50 10 70 0 92 Z" fill="url(#pin)" stroke="#4a2c08" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="0" cy="22" r="14" fill="#2a1804" stroke="#5a360c" stroke-width="3"/>
    <circle cx="0" cy="22" r="6.5" fill="#ffd100"/>
  </g>
</svg>
